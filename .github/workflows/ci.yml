name: ci
on:
  pull_request:
    paths-ignore:
      - '.angular/**'

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build library
        run: npm run build:lib

      - name: Lint
        run: npm run lint

      # Also fails if a public service method is missing from the API reference.
      - name: Build docs
        run: npm run docs:build

      # Use the Google Chrome preinstalled on the runner instead of
      # downloading Chromium and its system deps via Playwright on every run.
      - name: Test
        run: npm test -- --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome
