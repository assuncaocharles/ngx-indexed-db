<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ngx-indexed-db: IndexedDB for Angular</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A typed, Observable-based Angular service for IndexedDB, with migrations, SSR support and a tiny API."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)" />
    <!-- Social previews. Image URLs must be absolute; regenerate og.png with `npm run docs:og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ngx-indexed-db" />
    <meta property="og:image" content="https://assuncaocharles.github.io/ngx-indexed-db/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ngx-indexed-db: IndexedDB for Angular, without the plumbing." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://assuncaocharles.github.io/ngx-indexed-db/og.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <docs-root></docs-root>
  </body>
</html>
